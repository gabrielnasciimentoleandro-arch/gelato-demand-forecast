name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check dependencies
        run: python -m pip check

      - name: Check formatting
        run: ruff format --check src tests scripts

      - name: Lint
        run: ruff check src tests scripts

      - name: Test with coverage
        run: pytest -q --cov=gelato_forecast --cov-report=term-missing --cov-report=xml

      - name: Audit dependencies
        if: matrix.python-version == '3.13'
        run: pip-audit --skip-editable

      - name: Build wheel
        if: matrix.python-version == '3.13'
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse

      - name: Upload reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            coverage.xml
            wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: gelato-demand-forecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test API
        run: |
          docker run --detach --rm --name gelato-api --publish 8000:8000 gelato-demand-forecast:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"model_ready":true'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs gelato-api
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"temperature_c":30.0}' \
            http://127.0.0.1:8000/predict | grep --quiet '"predicted_sales"'
          docker stop gelato-api
