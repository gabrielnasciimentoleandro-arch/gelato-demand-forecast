name: Sugerir uma melhoria
description: Proponha uma nova funcionalidade ou evolução do modelo.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou oportunidade
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solução sugerida
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Critério de sucesso
      description: Como a melhoria seria medida ou testada?
